; APRenewal 0.20.2 - d3d9.dll proxy for Alpha Protocol
; Put d3d9.dll + this file in <game>\Binaries\ next to APGame.exe.
; Log + shader folders are created at Binaries\APRenewal\

[Chain]
; Leave empty to use Windows' own d3d9.dll.
; To use DXVK: rename DXVK's x32\d3d9.dll to d3d9_dxvk.dll, put it in Binaries\ and set:
; RealD3D9=d3d9_dxvk.dll
RealD3D9=

[Display]
; 1 = borderless windowed on the game's monitor. Set the in-game resolution to your desktop resolution.
Borderless=1
; -1 = leave to the game, 0 = force off, 1 = force on
VSync=-1
; Precise frame cap (0 = off). Above ~62 also needs MulderConfig's "Uncap FPS".
FPSLimit=60
; Supersampling: 100 = off. 150 = render at 1.5x your desktop resolution in each direction
; (2.25x the pixels), 200 = 2x (4x the pixels), shown downscaled with a Mitchell filter.
; Needs Borderless=1. Applies at the next launch. Heavy on the GPU.
RenderScale=100

[Focus]
; 1 = pause the game (incl. dialogue timers) while another window is in front.
; The game stops rendering entirely while paused (0% GPU), the last frame stays on screen.
PauseOnFocusLoss=1
; 1 = keep the mouse cursor inside the game window while it has focus (multi-monitor fix).
; Released automatically when you alt-tab / the game pauses.
ConfineCursor=1

[PostFX]
; Master switch at startup (F11 toggles it in game)
Enabled=1
; 1 = apply to the finished 3D image *before* the UI is drawn (HUD/menus stay pixel-sharp).
;     Pure UI screens (no 3D behind them) get no PostFX. Needs Bloom on (default).
; 0 = old behaviour: apply to the final image incl. UI.
BeforeHUD=1
; 1 = FXAA anti-aliasing
FXAA=1
; Contrast-adaptive sharpening strength 0..100 (0 = off). Counteracts FXAA softness.
Sharpen=40
; Key to toggle all PostFX (SSAO + FXAA + sharpen) for comparison (virtual-key code). 122 = F11
; Ctrl + this key         = write a one-frame render trace to the log (for HUD-aware PostFX research).
; Ctrl + Shift + this key = same, plus save every render target of that frame as images
;                           to Binaries\APRenewal\capture_HHMMSS\ (takes a second, ~50-150 MB).
ToggleKey=122
; FXAA type: 0 = fast (console style), 1 = FXAA 3.11 quality (searches along the edge)
FXAAQuality=1
; Anti-aliasing type: 0 = FXAA fast, 1 = FXAA 3.11 quality, 2 = SMAA (falls back to FXAA if it can't compile)
AAMode=2
; Temporal stabiliser: blends in the previous frame (reprojected, clamped); % of history kept per frame
TemporalAA=1
TemporalHistory=75

[AO]
; Startup mode: 0 = off, 1 = on, 2 = debug view (F10 cycles it in game)
Mode=1
; Screen-space ambient occlusion on the 3D world (before the UI), using the depth UE3 stores
; in its HDR scene buffer. Needs BeforeHUD=1.
Enable=1
; Strength in percent (50 = subtle, 100 = default, 150 = strong)
Intensity=100
; Occlusion radius in UE3 world units (Mike is roughly 180-200 tall). Bigger = broader, softer shading.
Radius=40
; Horizontal field of view the game renders with, in degrees. Only needs to be roughly right.
FOV=85
; AO fades out towards this distance (world units)
MaxDistance=5000
; AO fades in over this distance from the camera, so things right in front of the lens stay clean
NearFade=30
; 0..100: how much very bright pixels (lamps, light strips) are spared from darkening.
; Lower it if bright shiny surfaces still flicker; raise it if lamps look grey.
ProtectHighlights=50
; Use the game's live camera FOV for AO (needs the 
; % of the AO removed where window glass covers the pixel (looking through glass)
BehindGlass=100
; % of the AO faded out by the game's height fog (distant fogged areas lose their AO)
FadeWithFog=100

[View] hooks); FOV above is the fallback
FOVAuto=1
; 1 = read the game's own 24-bit depth buffer (INTZ) for accurate AO; 0 = 16-bit HDR alpha only.
; Applies at the next launch. If you ever see rendering glitches unrelated to AO, try 0.
PreciseDepth=1
; Cycles SSAO: ON -> OFF -> DEBUG VIEW (shows the AO buffer only). 121 = F10
ToggleKey=121

[Colour]
; % soft toe instead of the game's hard black clip in its final pass (needs APRenewal's final pass)
ShadowDetail=70

[Grade]
; Colour grading of the 3D image (before the HUD), in linear light. Part of PostFX (F11).
Enable=1
; 1/100 stop (10 = +0.1 EV)
Exposure=10
; Percent. S-curve around mid grey that keeps black and white where they are.
Contrast=106
; Percent extra saturation for muted colours (vivid colours are left mostly alone)
Vibrance=45
; Percent, all colours
Saturation=100
; Black level, 1/10000 of white, soft toe: > 0 deepens shadows gradually (no clip to black), < 0 lifts them. 0 = untouched
; (replaces BlackLevel, which subtracted and clipped - even 1 crushed dark areas)
BlackLevel2=0
; -100 cool .. 100 warm
Temperature=0

[HDR]
; Real HDR output. Needs DXVK. Works under Proton with gamescope HDR (Steam Deck OLED, Linux;
; add DXVK_HDR=1 to the launch options). On native Windows it never got above SDR white on the
; tested PC, so it is ignored there unless AllowWindows=1.
; Highlights are rebuilt from the game's own HDR scene buffer; the HUD stays at paper white.
Enable=0
AllowWindows=0
; Brightness of white UI / SDR white, in nits. 0 = use Windows' "SDR content brightness"
PaperWhite=0
; How the game's SDR image is turned into light: 0 = sRGB curve, exactly like Windows shows SDR
; apps in HDR mode; 1 = gamma 2.2 (deeper shadows, more contrast)
Curve=0
; 1 = pre-encode for a driver/compositor that decodes the HDR output as sRGB again
; (symptom: test pattern grey ramp flat white after ~55%, 75% bars become full primaries)
CompensateSRGB=0
; Peak brightness in nits. 0 = use what the display reports
PeakNits=0
; Percent highlight expansion (0 = plain SDR image inside an HDR signal)
Highlights=100
; 1 = scRGB (recommended), 0 = HDR10 / PQ written by APRenewal (experimental: black screen
; with some DXVK versions)
Encoding=1

[View]
; Field of view and HUD aspect - replaces AlphaFixer (delete winmm.dll and AlphaFixer.ini).
; While AlphaFixer's winmm.dll is still in the folder, this section does nothing.
Enable=1
; Degrees for the normal third-person camera at 16:9 (the game's own is 60; AlphaFixer with
; FOVFactor=1.20 gave 85). Aim/zoom cameras scale along; wider screens get more (Hor+). Live in the menu.
FOV=85
; Keep the HUD and menus at 16:9 (centred) on wider screens
HUD169=1

[Game]
; 1 = skip the startup logo movies (only movies before the first 3D scene; story movies still play)
SkipIntros=1
; Movie names (prefixes, comma-separated) skipped when SkipIntros=1. The log lists every movie.
SkipMovies=slate_
; 1 = developer console in the APRenewal menu (Game tab)
Console=1
; 1 = occlusion queries always report visible: distant objects (trees behind walls) no longer pop in late
NoOcclusionCulling=1
; % of the game's draw and model-detail distances (sets PlayerController.LODDistanceFactor at each level load)
DrawDistance=150

[Shadows]
; Shadow map resolution multiplier: 1 = game default (2048), 2 = 4096, 4 = 8192 (lots of VRAM).
; The game ignores MaxShadowResolution above 2048 - this enlarges the buffer itself.
Scale=2
; Shadow edge filter width with Scale > 1: 0 = sized for the bigger map (sharp), 100 = the game's
; original width (soft, but sampled with gaps)
Softness=0
; Shadow filter: 0 = the game's PCF, 1 = soft (16 samples), 2 = softer (32), 3 = smoothest (48)
Filter=2
; Soft filter radius in 1/10 texels of the game's 2048 shadow map (25 = 2.5 texels)
Radius=25
; % contact shadows (short screen-space rays toward the light) inside the soft filter
ContactShadows=60

[Reflections]
; Screen-space reflections on floors and other upward-facing surfaces (Lighting & shadows tab)
Enable=1
; % strength, max ray length in world units, and how flat a surface must be (% of straight up)
Strength=35
Length=1500
FloorsOnly=70
; % blur of the reflections, growing with distance (0 = mirror)
Roughness=40

[Materials]
; Skin and metal materials are recognised by their shaders (hashes from the game's shader cache) and
; marked in a mask while the scene is drawn.
Enable=1
; % screen-space subsurface scattering on skin, and its width (% of ~1 cm)
SkinScatter=40
SkinScatterWidth=100
; % screen-space reflections on weapons and metal props (needs [Reflections] Enable=1), and their blur
; Materials named like snow, dirt, grass, carpet, concrete... are marked rough and never reflect.
MetalReflections=25
MetalRoughness=50
; % of the game's specular exponent on skin and on weapons / metal (tighter, glossier highlights; 100 = game)
SkinGloss=250
MetalGloss=350

[Glass]
; The game's window glass, rebuilt (its two glass materials). 100 = the game's look for each value.
Enable=1
; % of the game's opacity (lower = clearer glass)
Opacity=65
; % reflection strength
Reflection=160
; % angle-dependent reflection: weak head-on, strong at grazing angles (0 = the game's flat reflection)
Fresnel=70
; % of the game's luminance weighting, which crushes dim reflections to black (100 = the game)
ReflectionContrast=30
; % normal-map strength and % refraction (distortion behind the glass)
Bump=100
Refraction=100
; % screen-space reflections on glass, traced in this frame's depth and coloured from the previous frame (0 = cubemap only)
ScreenReflections=100

[Lighting]
; Characters and moving objects are lit from baked light probes (spherical harmonics + sky).
; CharacterEven = % of the directional part removed (lifts the dark side), CharacterFill = % extra ambient.
CharacterEven=0
CharacterFill=0

[Tonemap]
; Replaces the hard clip in the game's final HDR->LDR pass with a smooth highlight roll-off.
; Everything below the knee looks exactly like the game. Toggle in the menu (Colour tab) to compare.
Enable=1
; % of white where the roll-off starts (linear light, before the game's gamma)
Knee=60
; Scene brightness that becomes white, in % (the game's scene colour tops out at 400)
White=400
; % hue preservation: 0 = bright colours fade to white per channel, 100 = they keep their colour
HuePreserve=60
; 1 = use APRenewal's version of the game's final pass (needed for roll-off, gamma, bloom and DOF tuning)
ReplaceFinalPass=1
; 0 = the game's square-root gamma (as shipped), 1 = sRGB, 2 = gamma 2.2
Gamma=0

[Effects]
; The game's own effects, tuned inside its shaders. 100 = exactly the game's look.
BloomIntensity=100
; Added to the game's bloom threshold, x100 (its scale is 0..4): higher = fewer things glow
BloomThreshold=0
; 1 = tent-filtered bloom (smooth instead of blocky quarter-res glow)
BloomSmooth=1
; Depth of field strength in %, 0 = off
DepthOfField=100
DepthOfFieldSmooth=1
; Height fog density in %, 0 = off
FogDensity=100
; Motion blur strength in %, 0 = off
MotionBlur=100
; % of the game's motion blur for moving objects (MotionBlur above = camera motion)
MotionBlurObjects=100
; The game's directional edge blur (its built-in AA) and its unsharp-mask sharpening, in %
GameEdgeAA=100
GameSharpen=100
; APRenewal's wide HDR bloom added in the final pass (%), and its threshold (HDR scene value x100)
ModernBloom=35
ModernBloomThreshold=100
; % light shafts streaming from bright lamps and windows, and the HDR brightness that counts as a light (x100)
LightShafts=60
LightShaftThreshold=250
; Round bokeh discs for the background blur of the game's depth of field, and their size (%)
Bokeh=1
BokehSize=100

[Audio]
; HRTF 3D audio for headphones. Needs the OpenAL32.dll from this package (OpenAL Soft) in Binaries.
; 0 = off (normal stereo / surround), 1 = on, 2 = leave to OpenAL Soft (alsoft.ini)
HRTF=1

[Menu]
; Key that opens the in-game menu (virtual-key code). 45 = Insert
Key=45
; Menu cursor speed in percent
MouseSpeed=100

[Shaders]
; Log D3DXCompileShader calls. 0.1 test run: 0 calls -> game uses only precompiled shaders.
LogCompiles=1
DumpSource=0
Override=1
; Compiler for APRenewal's own shaders: auto (Windows' d3dcompiler_47 from System32; the game's under
; Wine/Proton), 47, or game (the game's 2009 D3DX compiler)
Compiler=auto

[Debug]
Verbose=0
; Frame capture: save float/16-bit render targets as lossless .dds (PNG clamps values above 1.0)
CaptureFloatDDS=1

[Textures]
; Anisotropic filtering forced on the game's material textures (0 = the game's), and mip bias x100 (negative = sharper)
Anisotropy=16
LodBias=0

[Controller]
; Built-in controller support (replaces GOG dixi: delete Binaries\dinput8.dll and dixi's xinput1_3.dll,
; use APRenewal's xinput1_3.dll). Every connected pad feeds one merged player-1 pad. 0 = plain XInput passthrough.
Enable=1
; Flip the game's own "Enable gamepad" option to whatever you touched last (pad <-> keyboard + mouse)
AutoSwitch=1
; Sources: Xbox / XInput pads, DualSense + DualShock 4 over HID (USB and Bluetooth), other DirectInput pads
XInput=1
Sony=1
DirectInput=1
; Rumble strength in % (0 = off, up to 200)
Rumble=100
; Extra radial stick dead zone in % on top of the game's own (0 = leave it to the game)
Deadzone=0
; Sony touchpad click acts as Back
TouchpadIsBack=1
; Sony light bar colour as RRGGBB (e.g. 2060FF); empty = leave it alone
LightBar=
; Button remaps on the final Xbox layout, e.g. "A=B B=A" (names: A B X Y LB RB LS RS BACK START GUIDE UP DOWN LEFT RIGHT)
Remap=
; Your own map for a DirectInput pad, by vendor + product id (both hex, shown in the log):
;   Map_057E2009=b0:A b1:B b2:X b3:Y b4:LB b5:RB b6:LT b7:RT b8:BACK b9:START b10:LS b11:RS x:LX y:LY z:RX rz:RY
; bN = DirectInput button N; axes x y z rx ry rz s0 s1, "z+" / "z-" = one half; a "-" before the target inverts it.
